camera:
  url: YOUR_CAMERA_URL_HERE
  width: 1280
  height: 720
  fps: 15
  buffer_size: 1
  rtsp_transport: tcp
detection:
  model: yolo11n.pt
  confidence: 0.6
  target_classes:
    - person
    - cat
    - dog
  inference_size: 512
  iou: 0.45
  max_det: 30
  process_every_n_frames: 3
temporal:
  cat:
    votes_required: 3
    window_size: 5
  dog:
    votes_required: 3
    window_size: 5
  person:
    votes_required: 2
    window_size: 4
motion:
  enabled: true
  threshold: 25
  min_contour_area: 500
  background_learning_rate: 0.01
  skip_frames_no_motion: true
roi:
  enabled: true
  include_zones:
    custom_ui_include:
      points:
        - - 0.36
          - 0.357
        - - 0.475
          - 0.733
        - - 0.033
          - 0.788
        - - 0.075
          - 0.296
      classes:
        - person
        - cat
        - dog
  exclude_zones:
    custom_ui_exclude:
      points:
        - - 0.892
          - 0.988
        - - 0.995
          - 0.982
        - - 0.665
          - 0.302
        - - 0.583
          - 0.312
      classes:
        - person
        - cat
        - dog
telegram:
  bot_token: YOUR_BOT_TOKEN_HERE
  chat_id: YOUR_CHAT_ID_HERE
alerts:
  cooldown_seconds:
    cat: 120
    dog: 120
    person: 60
  send_image: true
  burst_limit: 5
  burst_window_seconds: 600
web:
  enabled: true
  host: 0.0.0.0
  port: 8080
  preview_fps: 2
  max_events_history: 100
recording:
  snapshots_dir: ./media/snapshots
  clips_dir: ./media/clips
  ringbuffer_seconds: 15
  retention_days: 7
database:
  path: ./media/alertgate.db
  retention_days: 30
logging:
  level: INFO
  file: ./logs/app.log
